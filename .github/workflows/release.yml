name: Release CLI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must match Cargo version v{version}')
          PY
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir artifacts
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd "target/$TARGET/release" && 7z a "../../../artifacts/crabyard-$TARGET.zip" crabyard.exe)
          else
            tar -czf "artifacts/crabyard-$TARGET.tar.gz" -C "target/$TARGET/release" crabyard
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for asset in list(Path('artifacts').iterdir()):
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              asset.with_name(asset.name + '.sha256').write_text(f'{digest}  {asset.name}\n', encoding='utf-8', newline='\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crabyard-${{ matrix.target }}
          path: artifacts/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" --verify-tag --generate-notes ./*
